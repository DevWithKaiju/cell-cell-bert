[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-cell-bert"
version = "0.1.0"
description = "Source code for the paper: Defining and Evaluating Cell–Cell Relation Extraction from Biomedical Literature under Realistic Annotation Constraints"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
 { name = "Mei Yoshikawa", email = "lion.giraffe.may.2525[at]gmail.com" },
 { name = "Tadahaya Mizuno", email = "tadahaya[at]gmail.com"},
 { name = "Yohei Ohto" },
 { name = "Hiromi Fujimoto" },
 { name = "Hiroyuki Kusuhara" },
]
license = { file="LICENSE" }

dependencies = [
    "jupyterlab",
    "ipython",
    "matplotlib",
    "notebook",
    "numpy<2.0.0",
    "optuna==4.7.0",
    "pandas==2.3.3",
    "dask",
    "fastparquet",
    "lightgbm",
    "pip",
    "plotly",
    "polars",
    "requests",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "seaborn",
    "setuptools",
    "slackweb",
    "wandb",
    "wheel",
    "xgboost",
    "torch==2.11.0+cu130",
    "torchvision",
    "torchaudio",
    "transformers",
    "datasets",
    "altair",
    "graphviz",
    "lime",
    "captum",
    "spacy",
    "nltk",
    "sentencepiece",
    "huggingface-hub",
    "evaluate",
    "peft",
    "accelerate",
    "tensorboard",
    "mlflow",
    "pyarrow",
    "pyyaml",
    "pysqlite3",
    "rdkit",
    "deepchem",
    "pubchempy",
    "flake8",
    "autopep8",
    "pytz",
    "python-dateutil",
    "cupy-cuda12x",
    "einops",
    "networkx",
    "python-igraph",
    "leidenalg",
    "dvc",
    "pipdeptree",
    "nvidia-ml-py3",
    "voyager",
    "schedulefree",
    "statsmodels",
    "openai",
    "python-dotenv",
    "google-generativeai",
    "vllm>=0.22.0",
    "bitsandbytes",
    "safetensors",
    "tokenizers",
    "trl",
    "psutil",
    "pynvml",
    "duckdb",
    "scispacy",
    "fast-langdetect",
    "cython",
    "lxml",
    "elasticsearch>=8.0.0,<9.0.0"
]

# pytorch index url
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# strict pytorch to be installed from "pytorch-cu130"
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
