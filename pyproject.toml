[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-cell-bert"
version = "0.1.0"
description = "Source code for the paper: Defining and Evaluating Cell–Cell Relation Extraction from Biomedical Literature under Realistic Annotation Constraints"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
 { name = "Mei Yoshikawa", email = "lion.giraffe.may.2525[at]gmail.com" },
 { name = "Tadahaya Mizuno", email = "tadahaya[at]gmail.com"},
 { name = "Yohei Ohto" },
 { name = "Hiromi Fujimoto" },
 { name = "Hiroyuki Kusuhara" },
]
license = { file="LICENSE" }

dependencies = [
    "jupyterlab",
    "ipython",
    "matplotlib",
    "notebook",
    "numpy",
    "optuna",
    "pandas",
    "dask",
    "fastparquet",
    "lightgbm",
    "pip",
    "plotly",
    "polars",
    "elasticsearch>=8.0.0,<9.0.0",
    "pyarrow",
    "tqdm",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "setuptools",
    "slackweb",
    "wandb",
    "wheel",
    "xgboost",
    "torch==2.11.0+cu130",
    "torchvision",
    "torchaudio",
    "transformers",
    "datasets",
    "lxml",
    "python-dotenv",
    "cython",
    "spacy>=3.8",
    "fast-langdetect",
    "duckdb",
    "pynvml",
    "psutil",
    "accelerate",
    "trl>=1.7",
    "peft",
    "evaluate",
    "bitsandbytes",
    "safetensors",
    "tokenizers",
    "huggingface-hub",
    "sentencepiece",
    "vllm>=0.22.0",
    "umap-learn",
    "schedulefree>=1.4",
    "statsmodels",
    "thinc>=8.3",
    "openai",
]

[project.optional-dependencies]
# only needed for scripts/04_run_decoder_eval.py --model gemini-...
gemini = ["google-generativeai"]

# pytorch index url
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# strict pytorch to be installed from "pytorch-cu130"
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
